<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1157" width="900" height="1157" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#EEF2F7"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1157" fill="url(#bg)"/>
  <ellipse cx="450" cy="950" rx="260" ry="28" fill="url(#shadow)"/>

  <!-- Headphones Centered -->
  <g transform="translate(220, 240)">
    <!-- Main Steel Headband Arch -->
    <path d="M70 280 C 70 70, 390 70, 390 280" stroke="#1E293B" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M90 240 C 90 95, 370 95, 370 240" stroke="#334155" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Top Comfort Cushion Pad -->
    <path d="M140 125 C 190 90, 270 90, 320 125" stroke="#2563EB" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Left Arm & Pivot -->
    <rect x="52" y="270" width="36" height="50" rx="8" fill="#334155"/>
    <!-- Left Earcup -->
    <g transform="translate(10, 310)">
      <rect x="0" y="0" width="120" height="200" rx="60" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
      <!-- Soft Cushion Ring -->
      <rect x="20" y="20" width="80" height="160" rx="40" fill="#1E293B"/>
      <!-- Driver Grille Center -->
      <circle cx="60" cy="100" r="28" fill="#020617"/>
      <circle cx="60" cy="100" r="8" fill="#2563EB"/>
    </g>

    <!-- Right Arm & Pivot -->
    <rect x="372" y="270" width="36" height="50" rx="8" fill="#334155"/>
    <!-- Right Earcup -->
    <g transform="translate(330, 310)">
      <rect x="0" y="0" width="120" height="200" rx="60" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
      <rect x="20" y="20" width="80" height="160" rx="40" fill="#1E293B"/>
      <circle cx="60" cy="100" r="28" fill="#020617"/>
      <circle cx="60" cy="100" r="8" fill="#2563EB"/>
    </g>
  </g>
</svg>
