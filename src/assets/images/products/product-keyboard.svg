<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1157" width="900" height="1157" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#EEF2F7"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1157" fill="url(#bg)"/>
  <ellipse cx="450" cy="880" rx="360" ry="32" fill="url(#shadow)"/>

  <!-- Mechanical Gaming Keyboard -->
  <g transform="translate(100, 380)">
    <!-- Chassis Body -->
    <rect x="0" y="0" width="700" height="320" rx="20" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <!-- Keycap Plate Bed -->
    <rect x="18" y="18" width="664" height="284" rx="12" fill="#1E293B"/>

    <!-- Keycap Rows Mockup -->
    <!-- Function Row -->
    <g fill="#334155" stroke="#1E293B" stroke-width="2">
      <rect x="30" y="30" width="40" height="34" rx="6" fill="#2563EB"/>
      <rect x="80" y="30" width="40" height="34" rx="6"/>
      <rect x="130" y="30" width="40" height="34" rx="6"/>
      <rect x="180" y="30" width="40" height="34" rx="6"/>
      <rect x="240" y="30" width="40" height="34" rx="6"/>
      <rect x="290" y="30" width="40" height="34" rx="6"/>
      <rect x="340" y="30" width="40" height="34" rx="6"/>
      <rect x="390" y="30" width="40" height="34" rx="6"/>
      <rect x="450" y="30" width="40" height="34" rx="6"/>
      <rect x="500" y="30" width="40" height="34" rx="6"/>
      <rect x="550" y="30" width="40" height="34" rx="6"/>
      <rect x="610" y="30" width="60" height="34" rx="6" fill="#F59E0B"/>
    </g>

    <!-- Number Row -->
    <g fill="#475569" stroke="#1E293B" stroke-width="2">
      <rect x="30" y="74" width="640" height="36" rx="6"/>
    </g>
    <!-- QWERTY Row -->
    <g fill="#334155" stroke="#1E293B" stroke-width="2">
      <rect x="30" y="118" width="640" height="36" rx="6"/>
    </g>
    <!-- ASDF Row -->
    <g fill="#475569" stroke="#1E293B" stroke-width="2">
      <rect x="30" y="162" width="640" height="36" rx="6"/>
    </g>
    <!-- ZXCV Row -->
    <g fill="#334155" stroke="#1E293B" stroke-width="2">
      <rect x="30" y="206" width="640" height="36" rx="6"/>
    </g>
    <!-- Bottom Spacebar Row -->
    <g fill="#334155" stroke="#1E293B" stroke-width="2">
      <rect x="30" y="250" width="60" height="40" rx="6"/>
      <rect x="100" y="250" width="50" height="40" rx="6"/>
      <rect x="160" y="250" width="300" height="40" rx="6" fill="#2563EB"/>
      <rect x="470" y="250" width="50" height="40" rx="6"/>
      <rect x="530" y="250" width="40" height="40" rx="6"/>
      <rect x="580" y="250" width="40" height="40" rx="6"/>
      <rect x="630" y="250" width="40" height="40" rx="6"/>
    </g>

    <!-- Ambient Blue Backlight Underglow Glow -->
    <rect x="22" y="22" width="656" height="276" rx="10" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" fill="none"/>
  </g>
</svg>
