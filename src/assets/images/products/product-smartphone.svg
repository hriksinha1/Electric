<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1157" width="900" height="1157" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#EEF2F7"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="80%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1157" fill="url(#bg)"/>

  <!-- Soft Contact Shadow -->
  <ellipse cx="450" cy="980" rx="240" ry="28" fill="url(#shadow)"/>

  <!-- Phone Body -->
  <g transform="translate(250, 150)">
    <!-- Chassis -->
    <rect x="0" y="0" width="400" height="800" rx="52" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <!-- Screen Bezel -->
    <rect x="14" y="14" width="372" height="772" rx="42" fill="#020617"/>
    <!-- Active Display -->
    <rect x="22" y="22" width="356" height="756" rx="36" fill="url(#screen)"/>
    <!-- Screen Wave Graphics -->
    <path d="M22 540 Q 140 460, 240 520 T 378 480 L 378 778 L 22 778 Z" fill="#60A5FA" fill-opacity="0.3"/>
    <path d="M22 590 Q 150 510, 260 560 T 378 530 L 378 778 L 22 778 Z" fill="#93C5FD" fill-opacity="0.25"/>

    <!-- Camera Punch Hole -->
    <circle cx="200" cy="50" r="8" fill="#020617"/>
    <circle cx="200" cy="50" r="3" fill="#1E293B"/>

    <!-- Glass Reflection Line -->
    <path d="M22 22 L 280 22 L 60 778 L 22 778 Z" fill="#FFFFFF" fill-opacity="0.06"/>
  </g>
</svg>
