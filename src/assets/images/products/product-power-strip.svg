<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1157" width="900" height="1157" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#EEF2F7"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1157" fill="url(#bg)"/>
  <ellipse cx="450" cy="980" rx="200" ry="24" fill="url(#shadow)"/>

  <!-- 6-Socket Surge Protected Power Strip (Vertical) -->
  <g transform="translate(350, 160)">
    <!-- Body -->
    <rect x="0" y="0" width="200" height="780" rx="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>

    <!-- Illuminated Master Switch (Top) -->
    <rect x="65" y="40" width="70" height="46" rx="10" fill="#EF4444"/>
    <rect x="75" y="48" width="50" height="18" rx="4" fill="#FCA5A5" opacity="0.6"/>
    <circle cx="100" cy="74" r="3" fill="#FFFFFF"/>

    <!-- Surge Protection & Ground Status LEDs -->
    <circle cx="70" cy="115" r="5" fill="#22C55E"/>
    <circle cx="130" cy="115" r="5" fill="#2563EB"/>

    <!-- 6 Sockets -->
    <!-- Socket 1 -->
    <circle cx="100" cy="190" r="38" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="172" r="5" fill="#334155"/>
    <ellipse cx="84" cy="200" rx="4" ry="4" fill="#334155"/>
    <ellipse cx="116" cy="200" rx="4" ry="4" fill="#334155"/>

    <!-- Socket 2 -->
    <circle cx="100" cy="290" r="38" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="272" r="5" fill="#334155"/>
    <ellipse cx="84" cy="300" rx="4" ry="4" fill="#334155"/>
    <ellipse cx="116" cy="300" rx="4" ry="4" fill="#334155"/>

    <!-- Socket 3 -->
    <circle cx="100" cy="390" r="38" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="372" r="5" fill="#334155"/>
    <ellipse cx="84" cy="400" rx="4" ry="4" fill="#334155"/>
    <ellipse cx="116" cy="400" rx="4" ry="4" fill="#334155"/>

    <!-- Socket 4 -->
    <circle cx="100" cy="490" r="38" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="472" r="5" fill="#334155"/>
    <ellipse cx="84" cy="500" rx="4" ry="4" fill="#334155"/>
    <ellipse cx="116" cy="500" rx="4" ry="4" fill="#334155"/>

    <!-- Socket 5 -->
    <circle cx="100" cy="590" r="38" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="572" r="5" fill="#334155"/>
    <ellipse cx="84" cy="600" rx="4" ry="4" fill="#334155"/>
    <ellipse cx="116" cy="600" rx="4" ry="4" fill="#334155"/>

    <!-- Socket 6 -->
    <circle cx="100" cy="690" r="38" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="100" cy="672" r="5" fill="#334155"/>
    <ellipse cx="84" cy="700" rx="4" ry="4" fill="#334155"/>
    <ellipse cx="116" cy="700" rx="4" ry="4" fill="#334155"/>

    <!-- Heavy-Duty Power Cord Relief (Bottom) -->
    <path d="M85 780 L85 860 Q 85 920, 20 940" stroke="#CBD5E1" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>
</svg>
