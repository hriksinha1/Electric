<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1157" width="900" height="1157" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#EEF2F7"/>
      <stop offset="100%" stop-color="#F7F8FA"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1157" fill="url(#bg)"/>

  <!-- Plugs Shadows -->
  <ellipse cx="320" cy="850" rx="160" ry="24" fill="url(#shadow)"/>
  <ellipse cx="600" cy="880" rx="160" ry="24" fill="url(#shadow)"/>

  <!-- First Smart Plug (Left, Front) -->
  <g transform="translate(190, 380)">
    <rect x="0" y="0" width="260" height="260" rx="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    <!-- Socket Face Inset -->
    <circle cx="130" cy="130" r="92" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>
    <!-- Earth Pin Hole -->
    <ellipse cx="130" cy="80" rx="12" ry="12" fill="#334155"/>
    <!-- Live & Neutral Sockets -->
    <ellipse cx="94" cy="144" rx="10" ry="10" fill="#334155"/>
    <ellipse cx="166" cy="144" rx="10" ry="10" fill="#334155"/>
    <!-- Status LED Glow Ring -->
    <circle cx="130" cy="130" r="105" stroke="#3B82F6" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- Power Button -->
    <rect x="236" y="115" width="28" height="30" rx="8" fill="#E2E8F0"/>
  </g>

  <!-- Second Smart Plug (Right, Tilted) -->
  <g transform="translate(480, 440)">
    <rect x="0" y="0" width="240" height="240" rx="54" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="4"/>
    <circle cx="120" cy="120" r="84" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <ellipse cx="120" cy="74" rx="11" ry="11" fill="#475569"/>
    <ellipse cx="86" cy="132" rx="9" ry="9" fill="#475569"/>
    <ellipse cx="154" cy="132" rx="9" ry="9" fill="#475569"/>
    <!-- Small Wi-Fi Symbol Graphic -->
    <path d="M106 170 Q 120 162, 134 170 M112 176 Q 120 170, 128 176 M120 182 A 1 1 0 0 1 120 184" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
