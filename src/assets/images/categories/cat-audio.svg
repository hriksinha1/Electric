<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 1272" width="848" height="1272" fill="none">
  <defs>
    <linearGradient id="catAudioBg" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="848" height="1272" fill="url(#catAudioBg)"/>
  <circle cx="424" cy="600" r="280" fill="#2563EB" fill-opacity="0.2" filter="blur(30px)"/>

  <!-- Headphones on Stand -->
  <g transform="translate(194, 320)">
    <!-- Stand Post -->
    <rect x="220" y="80" width="20" height="520" rx="6" fill="#334155"/>
    <ellipse cx="230" cy="600" rx="140" ry="24" fill="#1E293B" stroke="#475569" stroke-width="2"/>

    <!-- Headband -->
    <path d="M80 200 C 80 50, 380 50, 380 200" stroke="#1E293B" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M120 100 C 180 70, 280 70, 340 100" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Left Earcup -->
    <rect x="30" y="200" width="100" height="180" rx="50" fill="#020617" stroke="#334155" stroke-width="3"/>
    <circle cx="80" cy="290" r="20" fill="#2563EB"/>

    <!-- Right Earcup -->
    <rect x="330" y="200" width="100" height="180" rx="50" fill="#020617" stroke="#334155" stroke-width="3"/>
    <circle cx="380" cy="290" r="20" fill="#2563EB"/>
  </g>
</svg>
