<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 984" width="1200" height="984" fill="none">
  <defs>
    <linearGradient id="bgNew" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="launchBeam" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="984" fill="url(#bgNew)"/>
  <rect width="1200" height="984" fill="url(#launchBeam)"/>

  <!-- Futuristic Podium / Launch Plinth -->
  <g transform="translate(600, 680)">
    <ellipse cx="0" cy="0" rx="420" ry="110" fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>
    <ellipse cx="0" cy="-6" rx="380" ry="94" fill="#0F172A"/>
    <ellipse cx="0" cy="-10" rx="340" ry="80" fill="#1E3A8A" fill-opacity="0.5"/>
  </g>

  <!-- Floating Smartphone with Holographic Glow -->
  <g transform="translate(480, 240) rotate(-6)">
    <rect x="0" y="0" width="240" height="480" rx="36" fill="#020617" stroke="#38BDF8" stroke-width="3"/>
    <rect x="8" y="8" width="224" height="464" rx="28" fill="#1D4ED8" fill-opacity="0.7"/>
    <!-- Screen Wave Graphics -->
    <path d="M8 260 Q 80 180, 160 240 T 232 200 L 232 472 L 8 472 Z" fill="#60A5FA" fill-opacity="0.4"/>
    <circle cx="120" cy="30" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Compact Wireless Earbuds in Open Case (Right on Podium) -->
  <g transform="translate(740, 500)">
    <ellipse cx="70" cy="60" rx="60" ry="40" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="50" cy="48" r="16" fill="#0F172A"/>
    <circle cx="90" cy="48" r="16" fill="#0F172A"/>
    <circle cx="50" cy="48" r="4" fill="#3B82F6"/>
    <circle cx="90" cy="48" r="4" fill="#3B82F6"/>
  </g>
</svg>
