<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 984" width="1200" height="984" fill="none">
  <defs>
    <linearGradient id="bgFeature" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="featureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="984" fill="url(#bgFeature)"/>
  <circle cx="600" cy="520" r="380" fill="url(#featureGlow)"/>

  <!-- Stepped Geometric Pedestals -->
  <!-- Back Pedestal -->
  <path d="M400 560 L800 560 L850 680 L350 680 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="350" y="680" width="500" height="180" fill="#0F172A"/>

  <!-- Front Left Pedestal -->
  <path d="M220 640 L480 640 L520 740 L180 740 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="180" y="740" width="340" height="150" fill="#1E293B"/>

  <!-- Front Right Pedestal -->
  <path d="M680 620 L960 620 L1000 720 L640 720 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="640" y="720" width="360" height="170" fill="#1E293B"/>

  <!-- Showcase Products on Pedestals -->
  <!-- Smart Speaker (Center Back Pedestal) -->
  <g transform="translate(540, 360)">
    <rect x="0" y="0" width="120" height="180" rx="30" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <ellipse cx="60" cy="24" rx="46" ry="12" fill="#2563EB"/>
    <ellipse cx="60" cy="24" rx="16" ry="4" fill="#60A5FA"/>
  </g>

  <!-- Earbuds Case (Left Pedestal) -->
  <g transform="translate(280, 500)">
    <rect x="0" y="0" width="140" height="110" rx="40" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="70" cy="55" r="4" fill="#22C55E"/>
  </g>

  <!-- Smartwatch (Right Pedestal) -->
  <g transform="translate(760, 480)">
    <!-- Straps -->
    <rect x="25" y="0" width="50" height="150" rx="10" fill="#020617"/>
    <!-- Watch Body -->
    <rect x="0" y="30" width="100" height="110" rx="28" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="50" cy="85" r="36" fill="#1D4ED8"/>
    <circle cx="50" cy="85" r="2" fill="#FFFFFF"/>
  </g>
</svg>
