<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" width="1400" height="875" fill="none">
  <defs>
    <linearGradient id="collBg" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="875" fill="url(#collBg)"/>
  <circle cx="700" cy="437" r="380" fill="#2563EB" fill-opacity="0.18"/>

  <!-- Overhead Electronics Flatlay Arrangement -->
  <!-- Laptop in Center -->
  <g transform="translate(480, 240)">
    <rect x="0" y="0" width="440" height="280" rx="14" fill="#020617" stroke="#334155" stroke-width="3"/>
    <rect x="14" y="14" width="412" height="252" rx="8" fill="#1D4ED8" fill-opacity="0.5"/>
  </g>

  <!-- Smartphone at Left -->
  <g transform="translate(320, 280) rotate(-10)">
    <rect x="0" y="0" width="110" height="220" rx="20" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
    <rect x="6" y="6" width="98" height="208" rx="16" fill="#0F172A"/>
  </g>

  <!-- Wireless Headphones at Right -->
  <g transform="translate(980, 280)">
    <circle cx="60" cy="110" r="44" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <circle cx="160" cy="110" r="44" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <path d="M60 110 C 60 20, 160 20, 160 110" stroke="#334155" stroke-width="12" fill="none"/>
  </g>
</svg>
