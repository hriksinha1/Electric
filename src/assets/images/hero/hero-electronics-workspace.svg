<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 952" width="2000" height="952" fill="none">
  <defs>
    <radialGradient id="deskGlow" cx="72%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </radialGradient>
    <linearGradient id="warmLamp" x1="88%" y1="0%" x2="75%" y2="80%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="2000" height="952" fill="#0B1220"/>
  <rect width="2000" height="952" fill="url(#deskGlow)"/>
  <rect width="2000" height="952" fill="url(#warmLamp)"/>

  <!-- Subtle Architectural Grid / Wood Grain Desk Line -->
  <line x1="0" y1="740" x2="2000" y2="740" stroke="#1E293B" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="0" y="740" width="2000" height="212" fill="#070D18" fill-opacity="0.7"/>

  <!-- Warm Desk Lamp Element (Top Right) -->
  <circle cx="1780" cy="180" r="140" fill="#F59E0B" fill-opacity="0.12" filter="blur(40px)"/>
  <path d="M1780 80 L1840 240 L1720 240 Z" fill="#334155" opacity="0.4"/>
  <circle cx="1780" cy="240" r="18" fill="#FDE68A" opacity="0.8"/>

  <!-- Laptop (Center-Right, 1200, 380) -->
  <g transform="translate(1120, 360)">
    <!-- Screen Lid -->
    <rect x="40" y="20" width="460" height="300" rx="16" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <rect x="52" y="32" width="436" height="276" rx="10" fill="url(#laptopScreen)"/>
    <!-- Screen Content / Wave Graphic -->
    <path d="M52 220 Q 160 160, 270 210 T 488 180 L 488 308 L 52 308 Z" fill="#2563EB" fill-opacity="0.25"/>
    <path d="M52 245 Q 180 200, 290 235 T 488 215 L 488 308 L 52 308 Z" fill="#38BDF8" fill-opacity="0.15"/>
    <circle cx="270" cy="42" r="3" fill="#64748B"/>
    <!-- Base Keyboard Deck -->
    <path d="M0 320 L540 320 L580 380 L-40 380 Z" fill="url(#metallic)" stroke="#334155" stroke-width="1.5"/>
    <rect x="100" y="328" width="340" height="36" rx="4" fill="#0F172A" opacity="0.9"/>
    <rect x="220" y="367" width="100" height="9" rx="3" fill="#334155"/>
  </g>

  <!-- Smartphone (Right Foreground, 1640, 520) -->
  <g transform="translate(1620, 480) rotate(-8)">
    <rect x="0" y="0" width="120" height="240" rx="24" fill="#090D16" stroke="#475569" stroke-width="3"/>
    <rect x="6" y="6" width="108" height="228" rx="20" fill="url(#phoneScreen)"/>
    <circle cx="60" cy="18" r="4" fill="#0B1220"/>
    <!-- Glass Highlight Sheen -->
    <path d="M6 6 L70 6 L10 180 L6 180 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>

  <!-- Wireless Over-Ear Headphones (Center-Foreground, 960, 540) -->
  <g transform="translate(940, 500)">
    <!-- Headband Arch -->
    <path d="M40 140 C 40 40, 200 40, 200 140" stroke="#334155" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M40 140 C 40 50, 200 50, 200 140" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Left Earcup -->
    <rect x="16" y="120" width="48" height="84" rx="24" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="28" y="132" width="24" height="60" rx="12" fill="#0F172A"/>
    <!-- Right Earcup -->
    <rect x="176" y="120" width="48" height="84" rx="24" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="188" y="132" width="24" height="60" rx="12" fill="#0F172A"/>
  </g>

  <!-- Wireless Mouse (1500, 680) -->
  <g transform="translate(1480, 660)">
    <ellipse cx="40" cy="50" rx="30" ry="46" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="12" x2="40" y2="44" stroke="#64748B" stroke-width="2"/>
    <rect x="36" y="24" width="8" height="14" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Ambient Light Reflection on Foreground Desk -->
  <ellipse cx="1380" cy="740" rx="340" ry="18" fill="#2563EB" fill-opacity="0.12" filter="blur(16px)"/>
</svg>
