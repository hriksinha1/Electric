<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <rect width="1200" height="630" fill="#0B1220"/>
  <!-- Ambient Glow -->
  <circle cx="850" cy="315" r="380" fill="#1E3A8A" fill-opacity="0.35"/>
  <circle cx="850" cy="315" r="220" fill="#2563EB" fill-opacity="0.2"/>

  <!-- Left Side: Brand Text -->
  <text x="100" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-0.03em">
    SunshineElectric
  </text>
  <text x="100" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#93C5FD">
    Electronics &amp; Electrical Essentials
  </text>
  <text x="100" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#64748B">
    Powering your world, one innovation at a time.
  </text>

  <!-- Right Side: Clean Hardware Silhouette Mockup -->
  <g transform="translate(720, 160)">
    <!-- Laptop -->
    <rect x="0" y="40" width="360" height="240" rx="14" fill="#020617" stroke="#334155" stroke-width="3"/>
    <rect x="12" y="52" width="336" height="216" rx="8" fill="#1D4ED8" fill-opacity="0.6"/>
    <!-- Phone -->
    <rect x="280" y="160" width="90" height="180" rx="18" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
    <rect x="285" y="165" width="80" height="170" rx="14" fill="#2563EB"/>
  </g>
</svg>
